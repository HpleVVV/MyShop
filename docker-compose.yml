services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myshop-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 80
      DATABASE_URL: postgresql://myshop:myshop@postgres:5432/myshop?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the VPS .env file}
      APP_URL: ${APP_URL:-http://localhost}
    ports:
      - "80:80"

  postgres:
    image: postgres:16-alpine
    container_name: myshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myshop
      POSTGRES_PASSWORD: myshop
      POSTGRES_DB: myshop
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myshop -d myshop"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - myshop-postgres-data:/var/lib/postgresql/data

volumes:
  myshop-postgres-data:
